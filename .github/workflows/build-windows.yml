name: Build Windows exe

# 在 GitHub 自己的 Windows 机器上打包单文件 exe，并作为 Release 附件发布。
# 触发方式：
#   1. push 到 main          -> 按 cts/__init__.py 里的版本号发布到 vX.Y
#   2. push 形如 v1.2 的标签 -> 发布到该标签
#   3. Actions 页面手动 Run  -> 同上（按版本号）
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 打包 ComfyUI_TagSelect.exe
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Windows 控制台默认 cp1252，而脚本里有中文输出，这里强制 UTF-8
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 检查标签数据是否齐全
        shell: bash
        run: |
          set -e
          for f in assets/data/tags_core.json assets/data/tags_full.tsv.gz assets/data/presets.json; do
            if [ ! -f "$f" ]; then echo "::error::缺少数据文件 $f"; exit 1; fi
            echo "OK  $f  $(du -h "$f" | cut -f1)"
          done

      - name: 源码自测（离屏，53 项断言）
        timeout-minutes: 10
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/selftest.py

      - name: 打包 exe
        timeout-minutes: 15
        run: python -m PyInstaller ComfyUI_TagSelect.spec --noconfirm --clean

      # 单独设超时：打包产物若因缺依赖卡死，宁可 5 分钟失败也不要拖满 30 分钟
      - name: 冒烟测试打包产物
        timeout-minutes: 5
        run: python tools/smoke_test.py dist/ComfyUI_TagSelect.exe

      - name: 生成校验和
        shell: bash
        run: |
          cd dist
          sha256sum ComfyUI_TagSelect.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 解析发布标签
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v$(python tools/version.py)"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "本次发布到: ${TAG}"

      - name: 上传到 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${{ steps.tag.outputs.tag }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 不存在，先创建"
            gh release create "$TAG" --title "$TAG" --notes "自动构建：ComfyUI_TagSelect $TAG"
          fi
          gh release upload "$TAG" dist/ComfyUI_TagSelect.exe dist/SHA256SUMS.txt --clobber
          echo "已上传："
          gh release view "$TAG" --json assets --jq '.assets[] | "  \(.name)  \(.size) B"'

      - name: 同时保留一份 workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComfyUI_TagSelect-windows-exe
          path: |
            dist/ComfyUI_TagSelect.exe
            dist/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
